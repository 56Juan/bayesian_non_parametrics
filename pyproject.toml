[build-system]
requires      = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name        = "model_psbp_fd"
version     = "0.1.0"
description = "PSBP extendido a series de tiempo funcionales"
requires-python = ">=3.11"

dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "seaborn>=0.12"
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    "scikit-fda>=0.9",
    "jinja2>=3.1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov"]

[tool.setuptools.packages.find]
where   = ["."]
include = ["model_psbp_fd*"]

# ── Crear entorno (Python 3.11.2 ya instalado) ────────────────────────────────
#
#   python -m venv .venv
#
#   # Linux / macOS
#   source .venv/bin/activate
#
#   # Windows
#   .venv\Scripts\activate
#
#   python -m pip install --upgrade pip
#   pip install -e .          # instala el paquete + todas las dependencias
#
#   # Solo si necesitas correr tests:
#   pip install -e ".[dev]"
#
# ─────────────────────────────────────────────────────────────────────────────