[build-system]
requires      = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name        = "model_psbp_fd"
version     = "0.1.0"
description = "PSBP extendido a series de tiempo funcionales"
requires-python = ">=3.11"

dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
fda  = ["scikit-fda>=0.9"]
dev  = ["pytest>=8.0", "pytest-cov"]

[tool.setuptools.packages.find]
where = ["."]
include = ["model_psbp_fd*"]
