name: psbp_fd
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11

  # Nucleo numerico y de datos
  - numpy>=1.26
  - scipy>=1.12
  - pandas>=2.0

  # Modelos de referencia de los notebooks NN_05 (RandomForest,
  # HistGradientBoosting). El VAR y el FAR se resuelven con numpy.
  - scikit-learn>=1.3

  # Figuras
  - matplotlib>=3.8
  - seaborn>=0.12

  # Indirectas: jinja2 lo exige DataFrame.style, openpyxl lo exige
  # pd.read_excel sobre .xlsx (notebooks/reales).
  - jinja2>=3.1.3
  - openpyxl>=3.1

  - jupyter
  - pytest
  - pip
  - pip:
      # No esta en conda-forge con la version que pide el proyecto.
      - scikit-fda>=0.9
